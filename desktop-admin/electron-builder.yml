appId: com.veehicee.vicora.cbt.admin
productName: VICORA CBT Admin
asar: true
extraMetadata:
  main: desktop-admin/main.cjs
directories:
  output: dist-admin-electron
files:
  - desktop-admin/**/*
  - package.json
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: VICORA-CBT-Admin-${version}-Windows.${ext}

extraResources:
  - from: dist/VICORA-CBT-Server.exe
    to: server/VICORA-CBT-Server.exe
