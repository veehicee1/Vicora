name: Build VICORA CBT Android APKs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "app.py"
      - "restore_backup.py"
      - "web/**"
      - ".github/workflows/build-android.yml"
  push:
    branches:
      - feature/cbt-core-import
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate release signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }

      - name: Restore permanent Android release signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vicora-cbt-release.jks"
          test -s "$RUNNER_TEMP/vicora-cbt-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vicora-cbt-release.jks" >> "$GITHUB_ENV"

      - name: Build Admin and Examination debug APKs
        working-directory: android
        run: gradle --no-daemon assembleAdminDebug assembleExaminationDebug

      - name: Build permanently signed release APKs
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleAdminRelease assembleExaminationRelease

      - name: Verify debug APKs
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          test -s android/app/build/outputs/apk/examination/debug/app-examination-debug.apk

      - name: Verify signed release APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/admin/release/app-admin-release.apk
          test -s android/app/build/outputs/apk/examination/release/app-examination-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/admin/release/app-admin-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/examination/release/app-examination-release.apk

      - name: Upload Admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VICORA-CBT-Admin-Android-debug
          path: android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error

      - name: Upload Examination debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VICORA-CBT-Examination-Android-debug
          path: android/app/build/outputs/apk/examination/debug/app-examination-debug.apk
          if-no-files-found: error

      - name: Publish signed APKs to public VICORA release repository
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: veehicee1/VICORA-Releases
          token: ${{ secrets.VICORA_RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: VICORA CBT ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/admin/release/app-admin-release.apk
            android/app/build/outputs/apk/examination/release/app-examination-release.apk

      - name: Upload signed release APKs for inspection
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: VICORA-CBT-Android-signed-release
          path: |
            android/app/build/outputs/apk/admin/release/app-admin-release.apk
            android/app/build/outputs/apk/examination/release/app-examination-release.apk
          if-no-files-found: error

