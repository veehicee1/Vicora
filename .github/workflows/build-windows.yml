name: Build VICORA CBT Windows Host and Installers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.py"
      - "tenant_migration.py"
      - "school_scoped_migration.py"
      - "multi_tenant.py"
      - "windows_host.py"
      - "restore_backup.py"
      - "diagnostics.py"
      - "main.py"
      - "exam_main.py"
      - "desktop_connection.py"
      - "scripts/**"
      - "build.bat"
      - "requirements.txt"
      - "package.json"
      - "desktop-electron/**"
      - "desktop-admin/**"
      - "web/**"
      - "tests/**"
      - "docs/**"
      - "installer/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches:
      - feature/cbt-core-import
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installers:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python support build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate desktop JavaScript
        run: |
          npm install
          npm run check
          npm run check:admin
      - name: Validate RAM measurement script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts\measure-examination-memory.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
      - name: Validate Python source
        run: python -m compileall -q app.py tenant_migration.py school_scoped_migration.py multi_tenant.py windows_host.py diagnostics.py restore_backup.py
      - name: Run server safety regression tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test Flask application and migration imports
        shell: pwsh
        run: |
          $env:CBT_DATA = Join-Path $env:RUNNER_TEMP "vicora-cbt-smoke"
          python -c "import tenant_migration, school_scoped_migration, multi_tenant, app; assert app.app is not None; print('Flask app and tenant migration imports OK')"
      - name: Build diagnostic and restore utilities
        shell: cmd
        run: build.bat
      - name: Build standalone VICORA Windows Host server
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name VICORA-CBT-Server --add-data "web;web" --hidden-import tenant_migration --hidden-import school_scoped_migration --hidden-import multi_tenant --collect-all flask --collect-all werkzeug --collect-all waitress --collect-all openpyxl --collect-all docx windows_host.py
          if (!(Test-Path "dist/VICORA-CBT-Server.exe")) { throw "VICORA Windows Host executable was not produced" }
          if ((Get-Item "dist/VICORA-CBT-Server.exe").Length -lt 1048576) { throw "VICORA Windows Host executable is unexpectedly small" }
      - name: Build Electron Examination app with bundled Chromium
        run: npm run dist:win
      - name: Build Electron Admin app with bundled Chromium
        run: npm run dist:admin:win
      - name: Verify all application and support executables
        shell: pwsh
        run: |
          $files = @(
            "dist-electron/VICORA-CBT-Examination-1.0.0-Windows.exe",
            "dist-admin-electron/VICORA-CBT-Admin-1.0.0-Windows.exe",
            "dist/CBTAdmin-Diagnostic.exe",
            "dist/CBTExamination-Diagnostic.exe",
            "dist/CBTRestore.exe",
            "dist/VICORA-CBT-Server.exe"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "$file was not produced" }
            if ((Get-Item $file).Length -lt 1048576) { throw "$file is unexpectedly small" }
          }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
      - name: Build three standalone offline installers
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not found at $compiler" }
          $scripts = @(
            "installer\GTMC-CBT-Admin-Fresh-Installation.iss",
            "installer\GTMC-CBT-Examination-Fresh-Installation.iss",
            "installer\GTMC-CBT-Complete-Update.iss"
          )
          foreach ($script in $scripts) {
            & $compiler $script
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed: $script" }
          }
          $setups = @(
            "dist-installer/VICORA-CBT-Admin-Fresh-Installation-Windows.exe",
            "dist-installer/VICORA-CBT-Examination-Fresh-Installation-Windows.exe",
            "dist-installer/VICORA-CBT-Complete-Update-Windows.exe"
          )
          foreach ($setup in $setups) {
            if (!(Test-Path $setup)) { throw "Installer was not produced: $setup" }
            if ((Get-Item $setup).Length -lt 1048576) { throw "Installer is unexpectedly small: $setup" }
          }
      - name: Verify installers use LZMA2 compression
        shell: pwsh
        run: |
          $scripts = @(
            'installer\GTMC-CBT-Admin-Fresh-Installation.iss',
            'installer\GTMC-CBT-Examination-Fresh-Installation.iss',
            'installer\GTMC-CBT-Complete-Update.iss'
          )
          foreach ($script in $scripts) {
            $content = (Get-Content $script -Raw) -replace "`r`n", "`n"
            if ($content -notmatch '(?m)^Compression=lzma2/ultra64$' -or $content -notmatch '(?m)^SolidCompression=yes$') {
              throw "LZMA2 compression must be enabled in $script"
            }
          }
      - name: Upload VICORA Admin installer separately
        uses: actions/upload-artifact@v4
        with:
          name: VICORA-Windows-Admin-Installer
          path: dist-installer/VICORA-CBT-Admin-Fresh-Installation-Windows.exe
          if-no-files-found: error
          retention-days: 90
      - name: Upload VICORA Examination installer separately
        uses: actions/upload-artifact@v4
        with:
          name: VICORA-Windows-Examination-Installer
          path: dist-installer/VICORA-CBT-Examination-Fresh-Installation-Windows.exe
          if-no-files-found: error
          retention-days: 90
      - name: Upload VICORA Complete Update installer separately
        uses: actions/upload-artifact@v4
        with:
          name: VICORA-Windows-Complete-Update
          path: dist-installer/VICORA-CBT-Complete-Update-Windows.exe
          if-no-files-found: error
          retention-days: 90
      - name: Upload VICORA Windows Host server separately
        uses: actions/upload-artifact@v4
        with:
          name: VICORA-Windows-Host-Server
          path: dist/VICORA-CBT-Server.exe
          if-no-files-found: error
          retention-days: 90
