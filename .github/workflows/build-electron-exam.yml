name: Build GTMC CBT Examination Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop-electron/**"
      - "package.json"
      - ".github/workflows/build-electron-exam.yml"

permissions:
  contents: read

jobs:
  build-electron-examination:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund
      - name: Check Electron source
        run: npm run check
      - name: Build standalone Windows application
        run: npm run dist:win
      - name: Confirm portable application exists
        shell: pwsh
        run: |
          $app = Get-ChildItem "dist-electron" -Filter "*.exe" | Select-Object -First 1
          if (!$app) { throw "Standalone examination application was not produced" }
          if ($app.Length -lt 50000000) { throw "Standalone examination application is unexpectedly small" }
      - name: Upload standalone examination application
        uses: actions/upload-artifact@v4
        with:
          name: GTMC-CBT-Examination-Desktop-Windows
          path: dist-electron/*.exe
          if-no-files-found: error
