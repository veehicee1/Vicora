# VICORA Android debug test builds.
# Uses the Codemagic macOS M2 runner. Do not enable paid billing.
workflows:
  vicora-android-test:
    name: VICORA Android Admin + Examination (debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: fix/codemagic-main-android-test
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Check build tools
        script: |
          set -e
          java -version
          : "${ANDROID_SDK_ROOT:?Codemagic did not provide ANDROID_SDK_ROOT}"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          command -v curl
          command -v unzip
      - name: Install Android SDK components
        script: |
          set -e
          # Use the modern Android Command-line Tools SDK manager.
          # The legacy $ANDROID_SDK_ROOT/tools/bin/sdkmanager is incompatible with Java 17.
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Modern sdkmanager not found at: $SDKMANAGER"
            echo "Available sdkmanager locations:"
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print || true
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Install compatible Gradle
        script: |
          set -e
          GRADLE_VERSION=8.11.1
          curl -fL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle --version
      - name: Build both VICORA Android test apps
        script: |
          set -e
          cd "$CM_BUILD_DIR/android"
          /tmp/gradle-8.11.1/bin/gradle --no-daemon --stacktrace assembleAdminDebug assembleExaminationDebug
      - name: Verify both APKs
        script: |
          set -e
          test -s "$CM_BUILD_DIR/android/app/build/outputs/apk/admin/debug/app-admin-debug.apk"
          test -s "$CM_BUILD_DIR/android/app/build/outputs/apk/examination/debug/app-examination-debug.apk"
          ls -lh "$CM_BUILD_DIR"/android/app/build/outputs/apk/{admin,examination}/debug/*.apk
    artifacts:
      - android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
      - android/app/build/outputs/apk/examination/debug/app-examination-debug.apk
      - /tmp/*.log
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
