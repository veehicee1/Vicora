<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply for VICORA CBT</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#18324a;font:16px/1.5 system-ui,Arial}.wrap{max-width:680px;margin:5vh auto;padding:24px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:18px;padding:26px;box-shadow:0 12px 40px #102b5012}h1{color:#102b50;margin:0 0 6px}p{color:#61738a}label{display:block;margin:14px 0 5px;font-weight:650}input,textarea{width:100%;padding:12px;border:1px solid #cbd8e6;border-radius:9px;font:inherit}button{margin-top:18px;padding:12px 20px;border:0;border-radius:9px;background:#2878c8;color:#fff;font-weight:700;font-size:16px;width:100%;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#msg{margin-top:14px;white-space:pre-wrap}.muted{font-size:13px;color:#61738a}</style></head><body><main class="wrap"><section class="card"><h1>VICORA School Registration</h1><p>Apply to bring your school onto the VICORA examination platform. Your school will be reviewed before a School Code is issued.</p><form id="apply"><label>School name</label><input name="school_name" required minlength="3" maxlength="120"><label>Contact person's name</label><input name="contact_name" required maxlength="120"><label>Official email</label><input name="email" type="email" required maxlength="180"><label>Phone / WhatsApp</label><input name="phone" required maxlength="40"><label>Country</label><input name="country" value="Nigeria" required maxlength="80"><label>School address</label><textarea name="address" rows="2" maxlength="240"></textarea><label>School type</label><input name="school_type" value="Secondary" required maxlength="60"><label>State</label><input name="state" value="Lagos" maxlength="80"><button id="submitBtn" type="submit">Submit application</button></form><div id="msg" role="status" aria-live="polite"></div><p class="muted">Your application is sent to VICORA Central for review. Activation details are issued after approval.</p></section></main><script>
document.querySelector('#apply').addEventListener('submit',async e=>{
  e.preventDefault();
  const form=e.currentTarget, f=new FormData(form), body=Object.fromEntries(f.entries());
  const message=document.querySelector('#msg'), button=document.querySelector('#submitBtn');
  message.textContent='Submitting…';button.disabled=true;
  try{
    const response=await fetch('/api/public/school-applications',{
      method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        schoolName:body.school_name,contactName:body.contact_name,contactEmail:body.email,
        contactPhone:body.phone,country:body.country,state:body.state,address:body.address,
        schoolType:body.school_type
      })
    });
    const raw=await response.text();let result;
    try{result=JSON.parse(raw)}catch(_){throw new Error('The registration service returned an unexpected response. Please try again later.')}
    if(!response.ok||result.ok!==true)throw new Error(result.error||'Application could not be submitted.');
    const applicationId=result.data&&result.data.applicationId;
    if(!applicationId)throw new Error('The service did not return an application reference. Please contact VICORA support before resubmitting.');
    message.textContent='Application received. Reference: '+applicationId+'. '+(result.data.message||'Your application is awaiting review.');
    form.reset();
  }catch(error){message.textContent=error.message||'Unable to submit application. Please try again later.'}
  finally{button.disabled=false}
});
</script></body></html>
