<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply for VICORA CBT</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#18324a;font:16px/1.5 system-ui,Arial}.wrap{max-width:680px;margin:5vh auto;padding:24px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:18px;padding:26px;box-shadow:0 12px 40px #102b5012}h1{color:#102b50;margin:0 0 6px}p{color:#61738a}label{display:block;margin:14px 0 5px;font-weight:650}input,textarea{width:100%;padding:12px;border:1px solid #cbd8e6;border-radius:9px;font:inherit}button{margin-top:18px;padding:12px 20px;border:0;border-radius:9px;background:#2878c8;color:#fff;font-weight:700;font-size:16px;width:100%}#msg{margin-top:14px;white-space:pre-wrap}.muted{font-size:13px;color:#61738a}</style></head><body><main class="wrap"><section class="card"><h1>VICORA School Registration</h1><p>Apply to bring your school onto the VICORA examination platform. Your school will be reviewed before a School Code is issued.</p><form id="apply"><label>School name</label><input name="school_name" required minlength="3" maxlength="120"><label>Contact person's name</label><input name="contact_name" required><label>Official email</label><input name="email" type="email" required><label>Phone / WhatsApp</label><input name="phone" required><label>Country</label><input name="country" value="Nigeria" required><label>School address</label><textarea name="address" rows="2"></textarea><label>Website (optional)</label><input name="website" type="url"><button>Submit application</button></form><div id="msg" role="status"></div><p class="muted">Submitting an application does not activate an account. VICORA must approve it first.</p></section></main><script>
document.querySelector('#apply').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),body=Object.fromEntries(f.entries()),m=document.querySelector('#msg');m.textContent='Submitting…';try{const r=await fetch('/api/public/school-applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error||'Application failed');m.textContent='Application received. Reference: '+j.application_id+'. '+j.message;e.target.reset()}catch(x){m.textContent=x.message}});
</script></body></html>
