<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate VICORA School Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#18324a;font:16px/1.5 system-ui,Arial}.wrap{max-width:600px;margin:5vh auto;padding:20px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:26px;box-shadow:0 12px 40px #102b5012}h1{color:#102b50;margin:0 0 8px}label{display:block;margin:14px 0 5px;font-weight:650}input{width:100%;padding:12px;border:1px solid #cbd8e6;border-radius:9px;font:inherit}button{margin-top:18px;padding:12px;width:100%;border:0;border-radius:9px;background:#2878c8;color:#fff;font-weight:700;font-size:16px}#msg{white-space:pre-wrap;margin-top:14px}</style></head><body><main class="wrap"><section class="card"><h1>Activate your VICORA school account</h1><p>Use the School Code and one-time activation token supplied after your school application was approved.</p><form id="activate"><label>School Code</label><input name="school_code" required placeholder="VIC-XXXXXXXX" style="text-transform:uppercase"><label>One-time activation token</label><input name="activation_token" type="password" required autocomplete="off"><label>Administrator email</label><input name="email" type="email" required autocomplete="email"><label>Create password (minimum 12 characters)</label><input name="password" type="password" required minlength="12" autocomplete="new-password"><button>Activate administrator</button></form><div id="msg" role="status"></div></section></main><script>document.querySelector('#activate').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());d.school_code=d.school_code.trim().toUpperCase();const m=document.querySelector('#msg');m.textContent='Activating…';try{const r=await fetch('/api/central/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw Error(j.error||'Activation failed');m.textContent=j.message+' Go to the administration page and sign in with your School Code.';e.target.reset()}catch(x){m.textContent=x.message}});</script></body></html>
