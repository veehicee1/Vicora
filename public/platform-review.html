<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VICORA Platform Review</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#18324a;font:15px/1.5 system-ui,Arial}.wrap{max-width:1000px;margin:4vh auto;padding:20px}section{background:#fff;border:1px solid #dbe5ef;border-radius:14px;padding:20px;margin-bottom:16px}input,select,textarea{padding:10px;border:1px solid #cbd8e6;border-radius:8px;font:inherit}input{width:100%}button{padding:9px 14px;border:0;border-radius:8px;background:#2878c8;color:white;font-weight:650;margin:5px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #e4ebf3}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;padding:12px;border-radius:8px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}</style></head><body><main class="wrap"><h1>VICORA Platform Super Admin</h1><section><label>Platform admin token</label><input id="token" type="password" autocomplete="off"><div class="row"><select id="status"><option>pending</option><option>approved</option><option>rejected</option><option>all</option></select><button onclick="load()">Load applications</button></div><p id="msg"></p></section><section><div id="list">Applications will appear here after authorization.</div></section><section><h3>One-time school activation details</h3><p>When an application is approved, save the School Code and activation token securely. The token is shown only once.</p><pre id="issued">No school approved in this session.</pre></section></main><script>
const headers=()=>({'Content-Type':'application/json','X-VICORA-PLATFORM-TOKEN':document.querySelector('#token').value});
async function load(){const m=document.querySelector('#msg');m.textContent='Loading…';try{const r=await fetch('/api/platform/applications?status='+document.querySelector('#status').value,{headers:headers()}),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load');document.querySelector('#list').innerHTML=j.applications.length?'<table><thead><tr><th>School</th><th>Contact</th><th>Submitted</th><th>Status</th><th>Decision</th></tr></thead><tbody>'+j.applications.map(a=>'<tr><td>'+esc(a.school_name)+'<br><small>'+esc(a.country)+'</small></td><td>'+esc(a.contact_name)+'<br>'+esc(a.email)+'<br>'+esc(a.phone)+'</td><td>'+new Date(a.submitted_ts*1000).toLocaleString()+'</td><td>'+esc(a.status)+'</td><td>'+(a.status==='pending'?'<button onclick="decide('+a.id+',\'approve\')">Approve</button><button onclick="decide('+a.id+',\'reject\')">Reject</button>':'—')+'</td></tr>').join('')+'</tbody></table>':'No applications found.';m.textContent='Loaded '+j.applications.length+' application(s).'}catch(e){m.textContent=e.message}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function decide(id,decision){const note=prompt('Optional review note:')||'';if(decision==='reject'&&!confirm('Reject this school application?'))return;try{const r=await fetch('/api/platform/applications/'+id+'/decision',{method:'POST',headers:headers(),body:JSON.stringify({decision,note})}),j=await r.json();if(!r.ok)throw Error(j.error||'Decision failed');if(decision==='approve')document.querySelector('#issued').textContent='School Code: '+j.school_code+'\nSchool ID: '+j.school_id+'\nActivation token: '+j.activation_token+'\nExpires: '+new Date(j.activation_expires_ts*1000).toLocaleString();await load()}catch(e){document.querySelector('#msg').textContent=e.message}}
</script></body></html>
