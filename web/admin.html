<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Admin Console</title>
<style>
:root{--bg:#f3f5f9;--pn:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e6ee;--pr:#1f4e79;--pr2:#2f6db0;--ok:#1e8e4e;--wa:#d98a00;--er:#c62f2f;--sb:#14283d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1620;--pn:#17212d;--tx:#e6ebf2;--mu:#93a1b3;--bd:#2a3748;--pr:#4f8fd6;--pr2:#6aa5e6;--sb:#0a1119}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:215px;background:var(--sb);color:#cfd9e6;padding:14px 0;flex:none;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:15px;margin:0 16px 12px;color:#fff}aside small{display:block;font-weight:400;color:#8fa3ba;margin-top:2px}
nav a{display:block;padding:9px 18px;color:#cfd9e6;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:#ffffff14}nav a.on{background:#ffffff1f;border-color:#6aa5e6;color:#fff}
main{flex:1;padding:22px 26px;min-width:0}h2{margin:0 0 16px;font-size:20px}h3{margin:0 0 10px;font-size:15px}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px}.card b{font-size:26px;display:block;color:var(--pr)}.card span{color:var(--mu);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;color:var(--mu);letter-spacing:.03em;position:sticky;top:0;background:var(--pn)}
.scroll{max-height:62vh;overflow:auto;border:1px solid var(--bd);border-radius:8px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--pn);color:var(--tx);padding:7px 13px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--pr2)}button.pr{background:var(--pr);border-color:var(--pr);color:#fff}button.dg{color:var(--er)}button.sm,.btn.sm{padding:3px 9px;font-size:12px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:7px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:70px}label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-writing,.b-live,.b-submitted{background:#1e8e4e22;color:var(--ok)}.b-offline,.b-closed{background:#c62f2f22;color:var(--er)}.b-not_started,.b-draft{background:#6b768622;color:var(--mu)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:8px 14px;border-radius:9px;background:var(--pn);border:1px solid var(--bd)}.chip b{font-size:18px;margin-right:6px}
.prog{height:8px;background:var(--bd);border-radius:5px;min-width:80px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pr2)}
.warn{background:#d98a0022;border:1px solid var(--wa);padding:10px 14px;border-radius:8px;margin-bottom:14px}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0}.hb span:first-child{width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .prog{flex:1;height:14px}
code,.mono{font-family:Consolas,monospace;background:var(--bg);padding:2px 6px;border-radius:5px;word-break:break-all}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
#modal>div{background:var(--pn);border-radius:12px;padding:20px;width:640px;max-width:100%;max-height:92vh;overflow:auto}
#toast{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:420px}
#login{margin:12vh auto;width:340px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mu{color:var(--mu)}
@media print{aside,.noprint{display:none!important}main{padding:0}.slip{break-inside:avoid}}
.slips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slip{border:1px dashed #888;padding:8px;font-size:12px}

/* Dashboard refresh: responsive navigation, compact insights and clearer actions */
.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}.dash-head h2{margin-bottom:3px}.panel-title{display:flex;justify-content:space-between;align-items:center}.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:9px}.quick-actions button{text-align:left;min-height:42px}.exam-insight{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--bd)}.exam-metrics{display:flex;gap:18px}.exam-metrics span{display:flex;flex-direction:column;min-width:62px}.exam-metrics b{font-size:18px;color:var(--pr)}.exam-metrics small{font-size:11px;color:var(--mu)}.activity-row{display:grid;grid-template-columns:135px 100px 1fr;gap:9px;padding:7px 0;border-bottom:1px solid var(--bd)}
@media(max-width:760px){body{display:block}aside{width:100%;height:auto;position:sticky;top:0;z-index:5;padding:9px 0}aside h1{margin:0 12px 7px}nav{display:flex;overflow-x:auto;white-space:nowrap;padding-bottom:3px}nav a{padding:9px 12px;border-left:0;border-bottom:3px solid transparent;flex:none}nav a.on{border-bottom-color:#6aa5e6}main{padding:14px 12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:11px}.card b{font-size:22px}.quick-actions{grid-template-columns:repeat(2,minmax(0,1fr))}.exam-metrics{width:100%;justify-content:space-between}.activity-row{grid-template-columns:1fr;gap:2px}.scroll{max-width:100%}}

.badge.ok{background:#16834a18;color:#16834a}.badge.wa{background:#b7790818;color:#946200}

input,select,textarea{border-radius:9px;min-height:38px}

@media(max-width:760px){aside{box-shadow:0 5px 18px #092b5018}nav a{margin:0 3px;padding:9px 11px}main{padding:15px 11px}.panel{padding:13px;border-radius:12px}.quick-actions button{min-height:46px}}

:root{--bg:#f3f7fc;--pn:#fff;--tx:#142b45;--mu:#637991;--bd:#dce6f1;--pr:#0756a8;--pr2:#287bc8;--sb:#062b50;--ok:#16834a;--wa:#a96c08;--er:#c43d43;--elev:0 12px 34px rgba(10,48,86,.075)}

</style></head><body>
<div id="login" class="panel" style="display:none"><h2>CBT Admin Console</h2>
<label>Username</label><input id="lu" value="admin" style="width:100%"><label>Password</label><input id="lp" type="password" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
<p><button class="pr" style="width:100%" onclick="doLogin()">Sign in</button></p><p class="mu" id="lerr"></p></div>
<aside id="side" style="display:none"><h1 id="brand">CBT Console<small>Admin</small></h1><nav id="nav"></nav></aside>
<main id="main"></main><div id="modal"><div id="mbox"></div></div><div id="toast"></div>
<script>
fetch('/api/public/info').then(r=>r.json()).then(j=>{if(j.school_logo_url)document.documentElement.style.setProperty('--school-logo','url("'+j.school_logo_url+'?v='+Date.now()+'")')}).catch(()=>{});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.style.background=bad?'#c62f2f':'#222';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4200)};
async function api(p,o={}){const fd=o.body instanceof FormData;const r=await fetch('/api/admin'+p,{credentials:'same-origin',...o,headers:o.body&&!fd?{'Content-Type':'application/json'}:{}});
 if(r.status===401&&p!=='/login'){showLogin();throw new Error('Please sign in')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));return j}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})}),del=p=>api(p,{method:'DELETE'});
const run=async f=>{try{return await f()}catch(e){toast(e.message,1)}};
function modal(html){$('#mbox').innerHTML=html;$('#modal').style.display='flex'}const closeModal=()=>{$('#modal').style.display='none'};
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
const opts=(a,sel,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.name||x.title)}</option>`).join('');
const NAV=[['dashboard','📊 Dashboard'],['monitor','🖥 Live Monitor'],['messages','✉ Student Messages'],['exams','📝 Exams'],['questions','❓ Question Bank'],['theoryMarking','✍ Theory Marking'],['students','🎓 Students'],['classes','🏫 Classes'],['subjects','📚 Subjects'],['results','🏆 Results'],['settings','⚙ Settings & Backup'],['audit','📜 Activity Log']];
$('#nav').innerHTML=NAV.map(([k,v])=>`<a data-p="${k}" onclick="go('${k}')">${v}</a>`).join('');
let timer=null;
function go(p){clearInterval(timer);timer=null;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));location.hash=p;run(()=>pages[p]())}
async function boot(){const m=await api('/me').catch(()=>({}));if(!m.user)return showLogin();$('#login').style.display='none';$('#side').style.display='block';$('#brand').innerHTML=esc(m.school)+'<small>Admin Console</small>';const h=location.hash.slice(1);go(h in pages?h:'dashboard')}
function showLogin(){$('#side').style.display='none';$('#main').innerHTML='';$('#login').style.display='block'}
async function doLogin(){try{await post('/login',{username:$('#lu').value,password:$('#lp').value});boot()}catch(e){$('#lerr').textContent=e.message}}
const logout=async()=>{await post('/logout');showLogin()};

// ---------- reusable import dialog (Excel / Word / CSV)
function importDialog(kind,title,{classes=[],subjects=[]}={},done){
 const extra=kind==='students'?`<label>Default class (used when the file has no Class column)</label><select id="ic">${opts(classes,'', '— none —')}</select>`:kind==='questions'?`<label>Default subject (used when the file has no Subject column)</label><select id="is">${opts(subjects,'','— none —')}</select>`:'';
 modal(`<h3>${title}</h3><p class="mu">Upload an <b>Excel (.xlsx)</b>, <b>Word (.docx, data in a table)</b> or <b>CSV</b> file. Header names are matched automatically. ${kind==='questions'?'New subjects are created automatically.':kind==='students'?'New classes are created automatically; existing RegNos are updated.':''}</p>
 <p>Templates: <a class="btn sm" href="/api/admin/template/${kind}/xlsx">Excel</a> <a class="btn sm" href="/api/admin/template/${kind}/docx">Word</a></p>${extra}
 <label>File</label><input type="file" id="if" accept=".xlsx,.xlsm,.csv,.docx"><div id="ir" style="margin-top:12px"></div>
 <p style="text-align:right"><button onclick="closeModal()">Close</button> <button class="pr" id="ib">${kind==='questions'?'Validate & preview':'Upload'}</button></p>`);
 $('#ib').onclick=()=>run(async()=>{const f=$('#if').files[0];if(!f)throw new Error('Choose a file first');const fd=new FormData();fd.append('file',f);
  if($('#ic'))fd.append('default_class',$('#ic').selectedOptions[0].text==='— none —'?'':$('#ic').selectedOptions[0].text);if($('#is'))fd.append('default_subject',$('#is').selectedOptions[0].text==='— none —'?'':$('#is').selectedOptions[0].text);
  $('#ib').disabled=true;$('#ib').textContent='Working…';let r;try{r=await api('/import/'+kind,{method:'POST',body:fd})}finally{$('#ib').disabled=false;$('#ib').textContent=kind==='questions'?'Validate & preview':'Upload'}
  const errs=(r.errors||[]).map(e=>`<tr><td>${e.row}</td><td>${esc(e.reason)}</td></tr>`).join('');
  const etab=errs?`<div class="scroll" style="max-height:200px;margin-top:8px"><table><tr><th>Row</th><th>Problem</th></tr>${errs}</table></div>`:'';
  if(kind==='questions'){$('#ir').innerHTML=`<div class="panel"><b style="color:var(--ok)">${r.valid} valid</b> · <b style="color:var(--er)">${r.error_count} with problems</b> · ${r.total} rows read${r.error_count?` · <a href="/api/admin/import/errors/${r.token}">download error list</a>`:''}${etab}</div>`;
   if(r.valid){$('#ib').textContent=`Import ${r.valid} questions`;$('#ib').onclick=()=>run(async()=>{const c=await post('/import/questions/commit',{token:r.token});toast(`${c.imported} questions imported`);closeModal();done&&done()})}}
  else{$('#ir').innerHTML=`<div class="panel"><b style="color:var(--ok)">${r.added} added</b> · ${r.updated||0} updated · <b style="color:var(--er)">${r.error_count} skipped</b>${etab}</div>`;done&&done()}})}

const pages={
async dashboard(){
 const [d,si,exams,classes]=await Promise.all([api('/dashboard'),api('/server-info'),api('/exams'),api('/classes')]);
 const mx=Math.max(1,...d.per_subject.map(s=>s.n));
 const urls=si.secure_reverse_proxy?['Use the school HTTPS address configured for the reverse proxy']:si.ips.length?si.ips.map(i=>'http://'+i+':'+si.port+'/'):['(Connect the server to the LAN to see its address)'];
 const completed=exams.filter(e=>e.submitted>0).slice(0,4);
 const analyses=await Promise.all(completed.map(e=>api('/results/'+e.id).then(r=>({exam:e,result:r})).catch(()=>null)));
 const valid=analyses.filter(Boolean);
 const recentHtml=valid.length?valid.map(x=>'<div class="exam-insight"><div><b>'+esc(x.exam.title)+'</b><div class="mu">'+esc(x.exam.subject)+' · '+esc(x.exam.classes||'')+' · '+x.result.count+' candidates</div></div><div class="exam-metrics"><span><b>'+x.result.avg+'%</b><small>Average</small></span><span><b>'+x.result.pass_rate+'%</b><small>Pass rate</small></span><span><b>'+x.result.high+'%</b><small>Highest</small></span></div><button class="sm" onclick="sessionStorage.res='+x.exam.id+';go(\'results\')">View results</button></div>').join(''):'<p class="mu">No submitted examination results are available yet. Results analysis will appear here after candidates submit an exam.</p>';
 const classHtml=classes.length?classes.map(c=>'<div class="hb"><span>'+esc(c.name)+'</span><div class="prog"><i style="width:'+Math.min(100,(c.n/Math.max(1,...classes.map(z=>z.n)))*100)+'%"></i></div><b>'+c.n+'</b></div>').join(''):'<p class="mu">No classes have been added.</p>';
 const qHtml=d.per_subject.map(s=>'<div class="hb"><span>'+esc(s.name)+'</span><div class="prog"><i style="width:'+(s.n/mx*100)+'%"></i></div><b>'+s.n+'</b></div>').join('')||'<p class="mu">No questions yet. Use Question Bank → Bulk import.</p>';
 $('#main').innerHTML='<div class="dash-head"><div><h2>Administrator dashboard</h2><p class="mu">A live overview of your CBT centre and examination activity.</p></div><div class="bar"><button class="pr" onclick="go(\'exams\')">＋ Create examination</button><button onclick="go(\'monitor\')">Open live monitor</button></div></div>'+
